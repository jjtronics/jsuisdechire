{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto space-y-6">
  <section class="rounded-2xl p-6 bg-white/90 dark:bg-slate-900/60 border border-white/30 shadow-sm space-y-4">
    <h1 class="text-2xl font-black text-slate-900 dark:text-slate-100">Connexion admin</h1>
    <p class="text-sm text-slate-600 dark:text-slate-300">Entre le login et le mot de passe configurés pour accéder à l'espace d'administration.</p>
    {% if error %}
    <p class="text-sm text-red-600 dark:text-red-400">{{ error }}</p>
    {% endif %}
    <form method="post" class="space-y-4">
      <label class="block space-y-1">
        <span class="text-sm font-semibold text-slate-800 dark:text-slate-200">Login</span>
        <input type="text" name="login" class="w-full rounded-lg border border-slate-200/80 dark:border-slate-700 bg-white/90 dark:bg-slate-950/40 px-3 py-2 text-sm" required autofocus autocomplete="username">
      </label>
      <label class="block space-y-1">
        <span class="text-sm font-semibold text-slate-800 dark:text-slate-200">Mot de passe</span>
        <input type="password" name="password" class="w-full rounded-lg border border-slate-200/80 dark:border-slate-700 bg-white/90 dark:bg-slate-950/40 px-3 py-2 text-sm" required autocomplete="current-password">
      </label>
      <button type="submit" class="w-full px-4 py-2 rounded-xl bg-rose-600 text-white hover:bg-rose-700">Se connecter</button>
    </form>
    <p class="text-xs text-slate-500 dark:text-slate-400">Identifiants par défaut : <strong>admin</strong> / <strong>jsuisdechire</strong>.</p>
  </section>
</div>
{% endblock %}
