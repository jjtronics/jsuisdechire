{% extends "base.html" %}
{% block content %}
<div class="rounded-2xl p-6 bg-white/90 dark:bg-slate-900/60 border border-white/30 space-y-4">
  <h2 class="text-xl font-bold" data-i18n="t1.heading">Test 1 · Réaction</h2>
  <p class="px-4 py-3 rounded-xl bg-rose-100/80 border border-rose-200/60 text-rose-900 text-base font-semibold leading-relaxed shadow-sm dark:bg-rose-500/10 dark:border-rose-500/40 dark:text-rose-100" data-i18n="t1.notice">Prêt·e ? Dès que le fond passe au VERT, tape plus vite que ton ombre. Si tu tires trop tôt, on recommence !</p>
  <div id="t1"></div>
  <div class="flex justify-end"><a id="next" href="/t2" class="px-4 py-2 rounded-xl bg-rose-600 text-white opacity-50 pointer-events-none" data-i18n="common.next" data-default-i18n="common.next" data-results-i18n="common.view_results">Suivant</a></div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.jsdFlow && typeof window.jsdFlow.setupPage === 'function'){
      window.jsdFlow.setupPage('t1', { nextSelector: '#next', hideBackIfFirst: true });
    }
  });
</script>
<script defer src="{{ asset_url('js/t1.js') }}"></script>
{% endblock %}
