{% extends "base.html" %}
{% block content %}
<div class="rounded-3xl p-5 bg-white/95 dark:bg-slate-900/70 border border-white/50 dark:border-slate-700/70 space-y-5 shadow-xl shadow-amber-200/30 sm:p-7">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="mb-1 text-xs font-black uppercase tracking-[0.2em] text-amber-600 dark:text-amber-300" data-i18n="t1.kicker">Mini-jeu 01 · Réaction</p>
      <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white sm:text-3xl" data-i18n="t1.heading">Test 1 · Réaction</h2>
    </div>
    <div class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-amber-300 to-orange-400 text-3xl shadow-lg shadow-amber-300/30" aria-hidden="true">⚡</div>
  </div>
  <p class="rounded-2xl border border-amber-200/70 bg-gradient-to-r from-amber-100/90 to-orange-100/80 px-4 py-3 text-sm font-bold leading-relaxed text-amber-950 shadow-sm dark:border-amber-500/40 dark:from-amber-500/15 dark:to-orange-500/10 dark:text-amber-100" data-i18n="t1.notice">Prêt·e ? Dès que le fond passe au VERT, tape plus vite que ton ombre. Si tu tires trop tôt, on recommence !</p>
  <div id="t1"></div>
  <div class="flex justify-end"><a id="next" href="/t2" class="px-4 py-2 rounded-xl bg-rose-600 text-white opacity-50 pointer-events-none" data-i18n="common.next" data-default-i18n="common.next" data-results-i18n="common.view_results">Suivant</a></div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.jsdFlow && typeof window.jsdFlow.setupPage === 'function'){
      window.jsdFlow.setupPage('t1', { nextSelector: '#next', hideBackIfFirst: true });
    }
  });
</script>
<script defer src="{{ asset_url('js/t1.js') }}"></script>
{% endblock %}
