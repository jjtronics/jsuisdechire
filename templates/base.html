<!doctype html>
<html lang="fr" class="h-full" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JsuisDechire · Le site ultime pour vérifier si ton pote est bourré</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}</script>
    <link rel="manifest" href="{{ asset_url('manifest.webmanifest') }}">
    <meta name="theme-color" content="#f43f5e" />
    <link rel="icon" href="{{ asset_url('icons/icon-192.png') }}">
    <script defer src="{{ asset_url('js/i18n.js') }}"></script>
    <script defer src="{{ asset_url('js/core.js') }}"></script>
    <script defer src="{{ asset_url('js/session.js') }}"></script>
    <script>
      window.jsdConfig = window.jsdConfig || {};
      window.jsdConfig.settings = {{ app_settings | tojson | safe }};
    </script>
    <style>
  * { -webkit-tap-highlight-color: transparent; }
  body { -webkit-user-select: none; user-select:none; }
  </style>
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />

  </head>
  <body class="h-full bg-gradient-to-b from-pink-50 to-rose-100 text-gray-900 dark:from-slate-900 dark:to-slate-800 dark:text-slate-100">
    <div class="min-h-screen">
      <nav class="sticky top-0 backdrop-blur bg-white/70 dark:bg-slate-900/60 border-b border-white/20 z-10">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
          <a href="/" class="font-extrabold text-xl tracking-tight">jsuisdechire<span class="text-rose-500">.com</span></a>
          <div class="flex items-center gap-2">
            <button id="themeToggle" type="button" class="p-2 rounded-lg text-rose-600 hover:bg-rose-100 transition dark:text-rose-200 dark:hover:bg-slate-800" data-i18n-attr="aria-label:nav.theme_toggle">
              <span class="block dark:hidden" aria-hidden="true">☀️</span>
              <span class="hidden dark:block" aria-hidden="true">🌙</span>
            </button>
            <select id="langSelect" class="text-sm rounded-lg border bg-white/80 dark:bg-slate-800 dark:border-slate-700 px-2 py-1"></select>
            <a href="/leaderboard" class="text-sm px-3 py-1 rounded-lg bg-rose-600 text-white hover:bg-rose-700" data-i18n="nav.leaderboard">Top</a>
          </div>
        </div>
      </nav>
      <main class="max-w-5xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
      </main>
      <footer class="mt-12 border-t border-rose-100/60 dark:border-slate-700 bg-gradient-to-r from-rose-600/10 via-rose-500/5 to-rose-600/10">
        <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col items-center gap-4 text-center sm:text-left sm:flex-row sm:items-start sm:justify-between">
          <div class="flex flex-col sm:flex-row sm:items-center sm:gap-4">
            <span class="text-3xl" aria-hidden="true">🍹</span>
            <p class="mt-2 sm:mt-0 font-semibold tracking-wide text-rose-700 dark:text-rose-300" data-i18n="footer.tagline">
              Reste en vibe, hydrate-toi et si ça tourne trop, appelle un taxi.
            </p>
          </div>
          <p class="text-xs text-gray-500 dark:text-slate-400 max-w-md" data-i18n="footer.disclaimer">
            Ce n'est pas un dispositif médical. Si tu as bu : ne conduis jamais. · Dev par JJC
          </p>
        </div>
      </footer>
    </div>
    <script>
      const applyTheme = (theme) => {
        const next = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', next === 'dark');
        document.documentElement.dataset.theme = next;
        localStorage.setItem('jsd:theme', next);
      };

      const getPreferredTheme = () => {
        const stored = localStorage.getItem('jsd:theme');
        if (stored === 'dark' || stored === 'light') {
          return stored;
        }
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      };

      applyTheme(getPreferredTheme());

      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('themeToggle');
        if (btn) {
          btn.addEventListener('click', () => {
            const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(next);
          });
        }
      });

      if ('serviceWorker' in navigator) {
        addEventListener('load', () => navigator.serviceWorker.register('{{ url_for("service_worker", v=asset_version) }}'));
      }
    </script>
  </body>
</html>
