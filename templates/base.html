<!doctype html>
<html lang="fr" class="h-full" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }} · jsuisdechire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}</script>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <meta name="theme-color" content="#f43f5e" />
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <script defer src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/core.js') }}"></script>
    <style>
  * { -webkit-tap-highlight-color: transparent; }
  body { -webkit-user-select: none; user-select:none; }
  </style>
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />

<script>
// Theme toggle: toggles 'dark' class on html
document.addEventListener('DOMContentLoaded',()=>{
  const btn=document.getElementById('themeToggle');
  if(btn){
    btn.addEventListener('click',()=>{
      document.documentElement.classList.toggle('dark');
    });
  }
});

// Lang switcher: changes ?lang= and applies dict immediately
window.i18nDict=window.i18nDict||{fr:{},en:{},it:{}};
function getParam(n){const u=new URL(location.href);return u.searchParams.get(n);}
function setParam(n,v){const u=new URL(location.href);if(v==null)u.searchParams.delete(n);else u.searchParams.set(n,v);location.href=u.toString();}
function applyI18n(){
  const lang=(getParam('lang')||'fr').toLowerCase();
  const d=window.i18nDict[lang]||window.i18nDict.fr;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n'); if(d[k]) el.textContent=d[k];});
  const sel=document.getElementById('langSelect'); if(sel) sel.value=lang;
}
document.addEventListener('DOMContentLoaded',()=>{
  const sel=document.getElementById('langSelect');
  if(sel){
    sel.addEventListener('change',()=>{ setParam('lang', sel.value); });
  }
  applyI18n();
});
</script>

</head>
  <body class="h-full bg-gradient-to-b from-pink-50 to-rose-100 text-gray-900 dark:from-slate-900 dark:to-slate-800 dark:text-slate-100">
    <div class="min-h-screen">
      <nav class="sticky top-0 backdrop-blur bg-white/70 dark:bg-slate-900/60 border-b border-white/20 z-10">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
          <a href="/" class="font-extrabold text-xl tracking-tight">jsuisdechire<span class="text-rose-500">.com</span></a>
          <div class="flex items-center gap-2">
            <button id="themeToggle" type="button" class="p-2 rounded-lg text-rose-600 hover:bg-rose-100 transition dark:text-rose-200 dark:hover:bg-slate-800" aria-label="Basculer le thème">
              <span class="block dark:hidden" aria-hidden="true">☀️</span>
              <span class="hidden dark:block" aria-hidden="true">🌙</span>
            </button>
            <select id="langSelect" class="text-sm rounded-lg border bg-white/80 dark:bg-slate-800 dark:border-slate-700 px-2 py-1"></select>
            <a href="/leaderboard" class="text-sm px-3 py-1 rounded-lg bg-rose-600 text-white hover:bg-rose-700">Top</a>
          </div>
        </div>
      </nav>
      <main class="max-w-5xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
      </main>
      <footer class="py-8 text-center text-xs text-gray-500 dark:text-slate-400">
        <p>Ce n'est pas un dispositif médical. Si tu as bu : ne conduis jamais. · Dev par JJC</p>
      </footer>
    </div>
    <script>
      const applyTheme = (t) => { document.documentElement.classList.toggle('dark', t==='dark'); localStorage.setItem('jsd:theme', t); };
      applyTheme(localStorage.getItem('jsd:theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      if ('serviceWorker' in navigator) { addEventListener('load', ()=>navigator.serviceWorker.register('{{ url_for('static', filename='sw.js') }}')); }
    </script>
  </body>
</html>
