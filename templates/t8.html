{% extends "base.html" %}
{% block content %}
<div class="rounded-3xl p-5 shadow-2xl shadow-emerald-200/40 bg-white/95 dark:bg-slate-900/90 border border-white/60 dark:border-slate-700/70 space-y-5 sm:p-7">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="mb-1 text-xs font-black uppercase tracking-[0.2em] text-emerald-700 dark:text-emerald-300" data-i18n="t8.kicker">Mini-jeu 08 · Beer pong</p>
      <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white sm:text-3xl" data-i18n="t8.heading">Test 8 · Tir au gobelet</h2>
    </div>
  </div>
  <p class="rounded-2xl border border-emerald-200/70 bg-gradient-to-r from-emerald-50/95 to-amber-50/90 px-4 py-3 text-sm font-bold leading-relaxed text-emerald-950 shadow-sm dark:border-emerald-500/40 dark:from-emerald-500/15 dark:to-amber-500/10 dark:text-emerald-100 sm:text-base" data-i18n="t8.notice" data-i18n-param-attempts="{{ app_settings.pong_attempts|int }}">
    Lance la balle dans le gobelet mobile. Tu as {{ app_settings.pong_attempts|int }} tirs.
  </p>
  <div id="t8" class="space-y-4"></div>
  <div class="flex justify-between">
    <a href="/t7" class="px-4 py-2 rounded-xl border" data-i18n="common.back" data-flow-back="1">Retour</a>
    <a id="next" href="/results" class="px-4 py-2 rounded-xl bg-rose-600 text-white opacity-50 pointer-events-none" data-i18n="common.view_results" data-default-i18n="common.view_results" data-results-i18n="common.view_results">Voir les résultats</a>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const notice = document.querySelector('[data-i18n="t8.notice"]');
    if (!notice) return;
    const t = window.i18n || ((key) => key);
    const settings = (window.jsdConfig && window.jsdConfig.settings) || {};
    const fallback = {{ app_settings.pong_attempts|int }};
    const attempts = Number.isFinite(Number(settings.pong_attempts)) && Number(settings.pong_attempts) > 0 ? Math.round(Number(settings.pong_attempts)) : fallback;
    notice.setAttribute('data-i18n-param-attempts', attempts);
    notice.textContent = t('t8.notice', { attempts });
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.jsdFlow && typeof window.jsdFlow.setupPage === 'function') window.jsdFlow.setupPage('t8', { nextSelector: '#next', backSelector: '[data-flow-back]', hideBackIfFirst: true });
  });
</script>
<script defer src="{{ asset_url('js/t8.js') }}"></script>
<script defer src="{{ asset_url('js/t8-aim.js') }}"></script>
{% endblock %}
