{% extends "base.html" %}
{% block content %}
<div class="rounded-2xl p-6 bg-white/90 dark:bg-slate-900/60 border border-white/30 space-y-4">
  <h2 class="text-xl font-bold" data-i18n="t4.heading">Test 4 · Équilibre (mobile)</h2>
  <p class="px-4 py-3 rounded-xl bg-rose-100/80 border border-rose-200/60 text-rose-900 text-base font-semibold leading-relaxed shadow-sm dark:bg-rose-500/10 dark:border-rose-500/40 dark:text-rose-100" data-i18n="t4.notice">Téléphone dans la main, bras tendu : appuie sur Démarrer puis reste le plus immobile possible. Si tu bouges, le score se dandine aussi.</p>

  <div id="t4"></div>
  <div class="flex justify-between">
    <a href="/t3" class="px-4 py-2 rounded-xl border" data-i18n="common.back" data-flow-back="1">Retour</a>
    <a id="next" href="/t5" class="px-4 py-2 rounded-xl bg-rose-600 text-white opacity-50 pointer-events-none" data-i18n="common.next" data-default-i18n="common.next" data-results-i18n="common.view_results">Suivant</a>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.jsdFlow && typeof window.jsdFlow.setupPage === 'function'){
      window.jsdFlow.setupPage('t4', { nextSelector: '#next', backSelector: '[data-flow-back]', hideBackIfFirst: true });
    }
  });
</script>
<script defer src="{{ asset_url('js/t4.v157.js') }}"></script>
{% endblock %}
