{% extends "base.html" %}
{% block content %}
<div class="rounded-3xl p-5 bg-white/95 dark:bg-slate-900/70 border border-white/50 dark:border-slate-700/70 space-y-5 shadow-xl shadow-sky-200/30 sm:p-7">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="mb-1 text-xs font-black uppercase tracking-[0.2em] text-sky-600 dark:text-sky-300" data-i18n="t4.kicker">Mini-jeu 04 · Équilibre</p>
      <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white sm:text-3xl" data-i18n="t4.heading">Test 4 · Équilibre (mobile)</h2>
    </div>
  </div>
  <p class="rounded-2xl border border-sky-200/70 bg-gradient-to-r from-sky-100/90 to-indigo-100/80 px-4 py-3 text-sm font-bold leading-relaxed text-sky-950 shadow-sm dark:border-sky-500/40 dark:from-sky-500/15 dark:to-indigo-500/10 dark:text-sky-100" data-i18n="t4.notice">Téléphone dans la main, bras tendu : appuie sur Démarrer puis reste le plus immobile possible. Si tu bouges, le score se dandine aussi.</p>

  <div id="t4"></div>
  <div class="flex justify-between">
    <a href="/t3" class="px-4 py-2 rounded-xl border" data-i18n="common.back" data-flow-back="1">Retour</a>
    <a id="next" href="/t5" class="px-4 py-2 rounded-xl bg-rose-600 text-white opacity-50 pointer-events-none" data-i18n="common.next" data-default-i18n="common.next" data-results-i18n="common.view_results">Suivant</a>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.jsdFlow && typeof window.jsdFlow.setupPage === 'function'){
      window.jsdFlow.setupPage('t4', { nextSelector: '#next', backSelector: '[data-flow-back]', hideBackIfFirst: true });
    }
  });
</script>
<script defer src="{{ asset_url('js/t4-beer.js') }}"></script>
<script defer src="{{ asset_url('js/t4.v157.js') }}"></script>
{% endblock %}
