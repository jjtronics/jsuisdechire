{% extends "base.html" %}
{% block content %}
<div class="rounded-3xl p-5 shadow-2xl shadow-emerald-200/40 bg-white/95 dark:bg-slate-900/90 border border-white/60 dark:border-slate-700/70 space-y-5 sm:p-7">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="mb-1 text-xs font-black uppercase tracking-[0.2em] text-emerald-700 dark:text-emerald-300" data-i18n="t6.kicker">Mini-jeu 06 · Jeu des gobelets</p>
      <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white sm:text-3xl" data-i18n="t6.heading">Test 6 · Où est la balle ?</h2>
    </div>
  </div>
  <p
    class="rounded-2xl border border-emerald-200/70 bg-gradient-to-r from-emerald-50/95 to-amber-50/90 px-4 py-3 text-sm font-bold leading-relaxed text-emerald-950 shadow-sm dark:border-emerald-500/40 dark:from-emerald-500/15 dark:to-amber-500/10 dark:text-emerald-100 sm:text-base"
    data-i18n="t6.notice"
    data-i18n-param-attempts="{{ app_settings.rfl_attempts|int }}"
  >
    Observe la balle, suis les gobelets puis choisis le bon. Tu as {{ app_settings.rfl_attempts|int }} manches.
  </p>
  <div id="t6" class="space-y-4"></div>
  <div class="flex justify-between">
    <a href="/t5" class="px-4 py-2 rounded-xl border" data-i18n="common.back" data-flow-back="1">Retour</a>
    <a id="next" href="/t7" class="px-4 py-2 rounded-xl bg-rose-600 text-white opacity-50 pointer-events-none" data-i18n="common.next" data-default-i18n="common.next" data-results-i18n="common.view_results">Suivant</a>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const notice = document.querySelector('[data-i18n="t6.notice"]');
    if (!notice) return;
    const t = window.i18n ? window.i18n : ((key, params) => key);
    const fromConfig = window.jsdConfig && window.jsdConfig.settings ? window.jsdConfig.settings.rfl_attempts : undefined;
    const fallback = Number.isFinite(fromConfig) && fromConfig > 0 ? fromConfig : {{ app_settings.rfl_attempts|int }};
    notice.setAttribute('data-i18n-param-attempts', fallback);
    notice.textContent = t('t6.notice', { attempts: fallback });
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.jsdFlow && typeof window.jsdFlow.setupPage === 'function'){
      window.jsdFlow.setupPage('t6', { nextSelector: '#next', backSelector: '[data-flow-back]', hideBackIfFirst: true });
    }
  });
</script>
<script defer src="{{ asset_url('js/t6.js') }}"></script>
{% endblock %}
