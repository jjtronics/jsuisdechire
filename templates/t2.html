{% extends "base.html" %}
{% block content %}
<div class="rounded-3xl p-5 bg-white/95 dark:bg-slate-900/70 border border-white/50 dark:border-slate-700/70 space-y-5 shadow-xl shadow-violet-200/30 sm:p-7">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="mb-1 text-xs font-black uppercase tracking-[0.2em] text-violet-600 dark:text-violet-300" data-i18n="t2.kicker">Mini-jeu 02 · Couleurs</p>
      <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white sm:text-3xl" data-i18n="t2.heading">Test 2 · Stroop</h2>
    </div>
    <div class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-violet-400 to-cyan-400 text-3xl shadow-lg shadow-violet-300/30" aria-hidden="true">🎨</div>
  </div>
  <p class="rounded-2xl border border-violet-200/70 bg-gradient-to-r from-violet-100/90 to-cyan-100/80 px-4 py-3 text-sm font-bold leading-relaxed text-violet-950 shadow-sm dark:border-violet-500/40 dark:from-violet-500/15 dark:to-cyan-500/10 dark:text-violet-100" data-i18n="t2.notice">ATTENTION : clique sur la couleur affichée, pas sur le mot écrit. Même pompette, ton cerveau peut y arriver.</p>
  <div id="t2-start-section" class="flex justify-center">
    <button id="t2-start-button" type="button" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-semibold shadow-sm hover:bg-rose-500 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-slate-900" data-i18n="t2.button_start">Démarrer le test</button>
  </div>
  <div id="t2" class="hidden"></div>
  <div class="flex justify-between">
    <a href="/t1" class="px-4 py-2 rounded-xl border" data-i18n="common.back" data-flow-back="1">Retour</a>
    <a id="next" href="/t3" class="px-4 py-2 rounded-xl bg-rose-600 text-white opacity-50 pointer-events-none" data-i18n="common.next" data-default-i18n="common.next" data-results-i18n="common.view_results">Suivant</a>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.jsdFlow && typeof window.jsdFlow.setupPage === 'function'){
      window.jsdFlow.setupPage('t2', { nextSelector: '#next', backSelector: '[data-flow-back]', hideBackIfFirst: true });
    }
  });
</script>
<script defer src="{{ asset_url('js/t2.js') }}"></script>
{% endblock %}
