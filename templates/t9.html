{% extends "base.html" %}
{% block content %}
<div class="relative isolate overflow-hidden rounded-[2rem] border border-white/70 bg-white/95 p-5 shadow-2xl shadow-cyan-200/30 dark:border-slate-700/70 dark:bg-slate-900/90 dark:shadow-black/20 sm:p-7">
  <div class="pointer-events-none absolute -right-24 -top-28 h-72 w-72 rounded-full bg-cyan-300/25 blur-3xl dark:bg-cyan-500/10"></div>
  <div class="pointer-events-none absolute -bottom-32 left-1/4 h-72 w-72 rounded-full bg-violet-300/20 blur-3xl dark:bg-violet-500/10"></div>
  <div class="relative space-y-5">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="mb-1 text-xs font-black uppercase tracking-[0.2em] text-cyan-700 dark:text-cyan-300" data-i18n="t9.kicker">Mini-jeu 09 · Happy hour</p>
        <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white sm:text-3xl" data-i18n="t9.heading">Test 9 · Le glaçon fou</h2>
      </div>
      <div class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-cyan-300 to-violet-500 text-3xl shadow-lg shadow-cyan-300/30" aria-hidden="true">🧊</div>
    </div>
    <p class="rounded-2xl border border-cyan-200/70 bg-gradient-to-r from-cyan-50/95 to-violet-50/90 px-4 py-3 text-sm font-bold leading-relaxed text-cyan-950 shadow-sm dark:border-cyan-500/40 dark:from-cyan-500/15 dark:to-violet-500/10 dark:text-cyan-100 sm:text-base" data-i18n="t9.notice" data-i18n-param-duration="{{ (app_settings.ice_duration_ms or 20000)|int // 1000 }}">
      Attrape les glaçons, évite les olives et les fruits. Tu as {{ (app_settings.ice_duration_ms or 20000)|int // 1000 }} secondes.
    </p>
    <div id="t9" class="space-y-4"></div>
    <div class="flex justify-between">
      <a href="/t8" class="rounded-xl border px-4 py-2" data-i18n="common.back" data-flow-back="1">Retour</a>
      <a id="next" href="/results" class="pointer-events-none rounded-xl bg-rose-600 px-4 py-2 text-white opacity-50" data-i18n="common.view_results" data-default-i18n="common.next" data-results-i18n="common.view_results">Voir les résultats</a>
    </div>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const notice = document.querySelector('[data-i18n="t9.notice"]');
    if (!notice) return;
    const t = window.i18n || ((key) => key);
    const settings = (window.jsdConfig && window.jsdConfig.settings) || {};
    const fallback = {{ (app_settings.ice_duration_ms or 20000)|int }};
    const duration = Number.isFinite(Number(settings.ice_duration_ms)) && Number(settings.ice_duration_ms) > 0 ? Math.round(Number(settings.ice_duration_ms) / 1000) : Math.round(fallback / 1000);
    notice.setAttribute('data-i18n-param-duration', duration);
    notice.textContent = t('t9.notice', { duration });
  });
  document.addEventListener('DOMContentLoaded', () => {
    if (window.jsdFlow && typeof window.jsdFlow.setupPage === 'function') window.jsdFlow.setupPage('t9', { nextSelector: '#next', backSelector: '[data-flow-back]', hideBackIfFirst: true });
  });
</script>
<script defer src="{{ asset_url('js/t9.js') }}"></script>
{% endblock %}
