{% extends "base.html" %}
{% block content %}
<div class="rounded-3xl p-5 bg-white/95 dark:bg-slate-900/70 border border-white/50 dark:border-slate-700/70 space-y-5 shadow-xl shadow-rose-200/30 sm:p-7">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="mb-1 text-xs font-black uppercase tracking-[0.2em] text-rose-600 dark:text-rose-300" data-i18n="t5.kicker">Mini-jeu 05 · Mémoire</p>
      <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white sm:text-3xl" data-i18n="t5.heading">Test 5 · Mémoire</h2>
    </div>
  </div>
  <p class="rounded-2xl border border-rose-200/70 bg-gradient-to-r from-rose-100/90 to-orange-100/80 px-4 py-3 text-sm font-bold leading-relaxed text-rose-950 shadow-sm dark:border-rose-500/40 dark:from-rose-500/15 dark:to-orange-500/10 dark:text-rose-100" data-i18n="t5.notice">Retourne les dessous de verre deux par deux pour retrouver les paires. Tu as quelques secondes pour mémoriser avant que tout se referme.</p>
  <div id="t5"></div>
  <div class="flex justify-between">
    <a href="/t4" class="px-4 py-2 rounded-xl border" data-i18n="common.back" data-flow-back="1">Retour</a>
    <a id="next" href="/results" class="px-4 py-2 rounded-xl bg-rose-600 text-white opacity-50 pointer-events-none" data-i18n="common.view_results" data-default-i18n="common.view_results" data-results-i18n="common.view_results">Voir les résultats</a>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.jsdFlow && typeof window.jsdFlow.setupPage === 'function'){
      window.jsdFlow.setupPage('t5', { nextSelector: '#next', backSelector: '[data-flow-back]', hideBackIfFirst: true });
    }
  });
</script>
<script defer src="{{ asset_url('js/t5.js') }}"></script>
{% endblock %}
