{% extends "base.html" %}

{% block content %}
<section class="py-10">
  <div class="max-w-3xl mx-auto bg-white/80 backdrop-blur-sm border border-rose-100/60 rounded-3xl shadow-xl p-8 dark:bg-slate-900/70 dark:border-slate-700">
    <h1 class="text-3xl font-extrabold text-rose-600 dark:text-rose-300 mb-6" data-i18n="credits.title">Crédits</h1>
    <p
      class="text-base leading-relaxed text-gray-700 dark:text-slate-300 mb-4"
      data-i18n-html="credits.intro"
      data-i18n-param-html-author="<span class='font-semibold'>JJC</span>"
    >
      Ce site a été développé par <span class="font-semibold">JJC</span> et remercie tout particulièrement l'aide qui m'a été apportée par :
    </p>
    <ul class="space-y-2 text-gray-700 dark:text-slate-200 font-medium mb-6">
      <li class="flex items-center gap-3"><span class="text-rose-500">•</span><span>YB</span></li>
      <li class="flex items-center gap-3"><span class="text-rose-500">•</span><span>Aerin</span></li>
      <li class="flex items-center gap-3"><span class="text-rose-500">•</span><span>Red</span></li>
      <li class="flex items-center gap-3"><span class="text-rose-500">•</span><span>MFO</span></li>
      <li class="flex items-center gap-3"><span class="text-rose-500">•</span><span>TC</span></li>
    </ul>
    <p class="text-base leading-relaxed text-gray-700 dark:text-slate-300 mb-2" data-i18n="credits.outro">Et j'en oublie sûrement...</p>
    <p class="text-base font-semibold text-rose-600 dark:text-rose-300" data-i18n="credits.thanks">Merci à tous pour vos contributions !</p>
  </div>
</section>
{% endblock %}
