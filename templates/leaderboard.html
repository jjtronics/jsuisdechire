{% extends "base.html" %}
{% block content %}
<div class="rounded-2xl p-6 bg-white/90 dark:bg-slate-900/60 border border-white/30">
  <h1 class="text-2xl font-black mb-4" data-i18n="leaderboard.heading">Classement</h1>
  <table class="w-full text-sm">
    <thead class="text-left text-gray-500 dark:text-slate-300">
      <tr><th class="py-2" data-i18n="leaderboard.rank">#</th><th data-i18n="leaderboard.name">Nom</th><th data-i18n="leaderboard.score">Score</th><th data-i18n="leaderboard.date">Date</th></tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr class="border-t border-white/20">
        <td class="py-2">{{ loop.index }}</td>
        <td>{{ r['nickname'] or '—' }}</td>
        <td class="font-semibold">{{ r['total_score'] }}</td>
        <td>
          <time
            class="js-local-time"
            data-timestamp="{{ r['created_at'] }}"
            datetime="{{ r['created_at'] | int | datetime }}"
          >{{ r['created_at'] | int | datetime }}</time>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="py-4 text-center text-gray-500" data-i18n="leaderboard.empty">Aucun score pour l'instant.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const fmt = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    document.querySelectorAll('.js-local-time').forEach((el) => {
      const ts = Number(el.dataset.timestamp);
      if (!Number.isFinite(ts)) {
        return;
      }
      const date = new Date(ts * 1000);
      el.textContent = fmt.format(date);
      el.setAttribute('datetime', date.toISOString());
    });
  });
</script>
{% endblock %}
